name: qdl
summary: qdl Qualcomm Download tool
description: |
  This tool communicates with USB devices of id 05c6:9008 to upload a flash
  loader and use this to flash images.

base: core24

grade: stable
confinement: strict
adopt-info: qdl
license: BSD-3-Clause

platforms:
  arm64:
  amd64:
  riscv64:

environment:
  LD_LIBRARY_PATH: "$SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}"

plugs:
  home:
    read: all

apps:
  ks:
    command: usr/bin/qdl-ks
    plugs:
      - raw-usb
      - home
      - network-observe
      - adb-support

  qdl:
    command: usr/bin/qdl
    plugs:
      - raw-usb
      - home
      - network-observe
      - adb-support

  ramdump:
    command: usr/bin/qdl-ramdump
    plugs:
      - raw-usb
      - home
      - network-observe

parts:
  qdl:
    plugin: nil
    source: https://github.com/linux-msm/qdl.git
    source-type: git
    source-branch: master
    stage-packages:
      - libxml2
      - libusb-1.0-0
      - libzip4t64
    override-pull: |
      craftctl default
      snap_name="qdl"
      # decide if to build master or release(tag)
      last_released_tag="$(snap info ${snap_name} | awk '$1 == "latest/beta:" { print $2 }')"
      last_commited_tag=$(git describe --abbrev=0 --tags)
      # If the latest tag from the upstream project has not been released to
      # beta, build that tag instead of master.
      if [ "${last_commited_tag}" != "${last_released_tag}" ]; then
        git checkout ${last_commited_tag}
        craftctl set version=${last_commited_tag}
      else
        craftctl set version="$(git describe --tags | cut -c 2-)"
      fi
    override-build: |
      meson setup build
      meson compile -C build
      install -D -m 755 build/qdl ${SNAPCRAFT_PART_INSTALL}/usr/bin/qdl
      install -D -m 755 build/qdl-ramdump ${SNAPCRAFT_PART_INSTALL}/usr/bin/qdl-ramdump
      install -D -m 755 build/qdl-ks ${SNAPCRAFT_PART_INSTALL}/usr/bin/qdl-ks

build-packages:
  - help2man
  - libusb-1.0-0-dev
  - libxml2-dev
  - libzip-dev
  - meson
  - ninja-build
  - pkgconf
